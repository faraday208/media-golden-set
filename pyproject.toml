[project]
name = "golden-set-generator"
version = "0.1.0"
description = "Cherry-pick / golden set selection tool for AI training datasets"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "faraday208" }]
keywords = ["dataset", "cherry-pick", "selection", "training", "lora"]
dependencies = [
    # src/ stdlib only — sadece UI için Gradio
    "gradio>=4.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
