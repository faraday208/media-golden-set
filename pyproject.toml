[project]
name = "media-golden-set"
version = "1.0.0"
description = "Quality + caption-aware cherry-pick for AI training golden sets"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "faraday208" }]
keywords = ["dataset", "cherry-pick", "selection", "training", "lora", "golden-set"]
# stdlib-only — Pillow/numpy gerekmiyor
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
